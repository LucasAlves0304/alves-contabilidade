<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a2e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5276;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon - modern shield with calculator symbol -->
  <rect x="10" y="20" width="70" height="80" rx="16" fill="url(#grad)" />
  <rect x="22" y="32" width="46" height="30" rx="4" fill="none" stroke="white" stroke-width="2.5" />
  <line x1="28" y1="38" x2="40" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="44" x2="40" y2="44" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="28" y1="50" x2="36" y2="50" stroke="white" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="38" x2="62" y2="38" stroke="#f5a623" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="44" x2="62" y2="44" stroke="#f5a623" stroke-width="2" stroke-linecap="round" />
  <!-- checkmark at bottom of shield -->
  <polyline points="30,68 40,78 56,60" fill="none" stroke="#f5a623" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text: Alves -->
  <text x="100" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#0a2e4a" letter-spacing="-0.5">Alves</text>
  <!-- Text: Contabilidade -->
  <text x="100" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#1a5276" letter-spacing="3">CONTABILIDADE</text>
  <!-- Accent line -->
  <line x1="100" y1="90" x2="250" y2="90" stroke="#f5a623" stroke-width="2" stroke-linecap="round" opacity="0.6" />
</svg>
